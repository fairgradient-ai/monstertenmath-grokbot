# Routines for the Monster Ten Social Bot. Times are the bot's timezone (America/New_York).
#
# Grok routines have been reported to start 10-37 minutes late (pickletime-grokbot's README), and missed runs
# aren't replayed. Nothing here needs to start on time: a sweep picks up everything since the last one.
# No routine posts a written reply or changes the mode or phase: those need the owner's tap, and an approval
# card in an unattended run expires. Sweeps post only canned replies and first comments, and only in live mode.
#
# Create each routine paused, read it back, run it once, then unpause (SETUP.md, section 6).
schema_version = 1

[[routine]]
id = "sweep-morning"
required = true
slot = "08:05"
days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
prompt = """Run bash /workspace/monstertenmath-grokbot/scripts/run.sh sweep and post its output verbatim. Then follow the monsterten-social-operations skill, section "After a sweep": draft a reply for each item under "Needs a written reply" and post the list of drafts. Send nothing."""
posts = "Overnight comments: canned replies (live), drafts for the rest, anything for you."


# Routines for the Monster Ten Social Bot. Times are the bot's timezone (America/New_York).
#
# Grok routines have been reported to start 10-37 minutes late (pickletime-grokbot's README), and missed runs
# aren't replayed. Nothing here needs to start on time: a sweep picks up everything since the last one.
# Sweeps post canned replies, first comments and the Grok Bot's written replies that pass the check (live mode
# only). Nothing that needs the owner's tap runs in a routine (sensitive replies, outreach emails, mode, phase):
# an approval card in an unattended run expires, so those wait in chat for the owner.
#
# Create each routine paused, read it back, run it once, then unpause (SETUP.md, section 6).
schema_version = 1

[[routine]]
id = "sweep-morning"
required = true
slot = "08:05"
days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
prompt = """Run bash /workspace/monstertenmath-grokbot/scripts/run.sh sweep and post its output verbatim. Then follow the monsterten-social-operations skill, section "After a sweep": read run.sh examples, write a reply for each item under "Needs a written reply" with run.sh reply, draft the ones under "For you" that wait for an OK, and post what happened. Never send anything that needs the owner."""
posts = "Overnight comments: canned replies (live), drafts for the rest, anything for you."


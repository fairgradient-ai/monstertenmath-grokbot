# The pieces the bot knows, from monstertenmath_social/instagram/schedule.json (as of 21 Nov 2026: launch Tue 24 Nov,
# no realistic Reels; #3 stays because it was posted on 19 Nov and its comments still need answers).
#
# A post on Instagram is matched to a piece by the start of its caption (`caption_start`, compared with
# spaces collapsed), the same way the social repo's tools/v2/buffer/schedule.py finds a post in Buffer.
# A post that matches no piece still gets its comments answered, but without a guess key or an AI line.
# scripts/sync_social.py compares this file with a checkout of the social repo and lists what changed.
#
#   voice          "ai" (an AI voice), "owner" (re-cut to your voice) or "none" (no voice)
#   first_comment  posted by the bot once the post is live (live mode only). Pin it by hand: the API can't pin.
#   play_along     how to answer a guess. Never "No" (growth plan 6.2).
#   ai_reply       the answer to "Is this AI?" for this piece (growth plan 6.2, which replaces README section 7's).
# Text with source = "bot" was written for the bot and isn't in the pack: read it before going live.

[[piece]]
key = "#1"
name = "Hello"
type = "post"
ai = false
voice = "none"
caption_start = "Hello. We're Monster Ten."

[[piece]]

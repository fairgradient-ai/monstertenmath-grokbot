[[piece]]
key = "#3"
name = "Play along"
type = "reel"
ai = true
voice = "ai"
caption_start = "Play along with your 4- or 5-year-old"
first_comment = "How many is he hiding? Type your child's answer here."
ai_reply = "Good question! The pictures are AI-made stills of a kitchen table, the hand on the cup too, and the voice and music are AI-made. That's why it has the AI label. The game is Monster's Cave, and it works with 10 real crackers and a cup tonight."
[piece.play_along]
answer = 3
right = "Yes! 7 and 3 make 10."
wrong = "Let's check! Count up from 7: 8, 9, 10. He took 3."

[[piece]]
key = "#14"
name = "Sneaky Monster"
type = "reel"
ai = true
voice = "ai"
caption_start = "Watch closely: ten crackers, one very sneaky Monster"
first_comment = "Did you catch how many he took? Type the number."
ai_reply = "The Monster is drawn from our game's own art and animated frame by frame. The voice and music are AI-made, which is why it has the AI label. The game is Monster's Cave: 10 crackers and a cup."
[piece.play_along]
# The Reel hides the same 3 of 10 as #3, so #3's lines fit.
answer = 3
right = "Yes! 7 and 3 make 10."
wrong = "Let's check! Count up from 7: 8, 9, 10. He took 3."

[[piece]]
key = "#15"
name = "Flash dots"
type = "reel"
ai = true
voice = "none"
caption_start = "Flash dots: the dots show for one second"
